name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Linux (gcc) — 跨平台收口工具链。
  # 说明：引擎已移除 __int128、pipeline 改用 std::thread，故 MSVC 与 Linux gcc 均可编译；
  #       CI 用 Linux gcc 验证最权威（跨平台 + GoogleTest 需 posix 线程）。
  #       只构建核心目标（orderbook_v2 / kline_sec / unit_tests）。
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (gcc)
        run: |
          cmake -S "cpp v2" -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DUSE_FLAT_HASHMAP=0 \
                -DBUILD_TESTING=ON

      - name: Build (core targets)
        run: |
          cmake --build build --config Release \
                --target orderbook_v2 kline_sec unit_tests \
                --parallel $(nproc)

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
